<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svg/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the SCSS Refactoring Exercise</h1>
    </header>
    <main>
      <ul>
        <li>
          <article class="card">
            <h2 class="card-title">Card Title 1</h2>
            <p class="card-content">
              This is a sample description for the first card. It contains some brief information.
            </p>
            <button class="button">Primary Action</button>
          </article>
        </li>
        <li>
          <article class="card">
            <h2 class="card-title">Card Title 2</h2>
            <p class="card-content">
              This is a sample description for the second card. It contains additional information.
            </p>
            <button class="button-secondary">Secondary Action</button>
          </article>
        </li>
      </ul>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <a type="submit">Submit</a>
      </form>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2024 SCSS Refactoring Exercise</p>
    </footer>
  </body>
</html>
